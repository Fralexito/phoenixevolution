name: Desplegar a GitHub Pages
# Publica DOS cosas en el mismo sitio:
#   · /phoenixevolution/            → la rama `main`      (web oficial)
#   · /phoenixevolution/fase-beta/  → la rama `borrador`  (FASE BETA: vista previa privada; no sale en Google)
# Se ejecuta al subir cambios a cualquiera de las dos ramas, y siempre reconstruye ambas.
on:
  push:
    branches: [main, borrador]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Oficial (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: oficial
      - name: Fase beta (rama borrador)
        uses: actions/checkout@v4
        with:
          ref: borrador
          path: previa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compilar oficial
        working-directory: oficial
        run: npm ci && npm run build
      - name: Compilar vista previa
        working-directory: previa
        env:
          PES_BASE: /phoenixevolution/fase-beta
          PUBLIC_PREVIEW: "1"
        run: npm ci && npm run build
      - name: Juntar ambas
        run: |
          mkdir site
          cp -r oficial/dist/. site/
          mkdir site/fase-beta
          cp -r previa/dist/. site/fase-beta/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
